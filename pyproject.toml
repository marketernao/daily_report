[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-report"
version = "0.1.0"
description = "Generate Markdown daily reports and post them to Slack"
authors = [{name = "Daily Report Team"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
daily-report = "daily_report.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
